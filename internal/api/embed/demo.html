<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local JEV inspector</title>
  <style>
    :root {
      --bg: #12110f;
      --panel: #1c1b17;
      --ink: #e8e2d4;
      --muted: #9a927f;
      --line: #3a372e;
      --go: #c4e35a;
      --stop: #ff6b4a;
      --scan: #7ec8e3;
      --warn: #e6b84f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", "Hiragino Sans", sans-serif; }
    header {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 20px 28px 12px; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.08em; font-weight: 650; }
    header .sub { color: var(--muted); font-size: 13px; }
    #health { font-variant-numeric: tabular-nums; color: var(--muted); }
    #health.ok { color: var(--go); }
    #health.bad { color: var(--stop); }
    .speed {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      padding: 16px 28px; border-bottom: 1px solid var(--line);
    }
    .chip { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
    .chip b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .chip span { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
    main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; min-height: calc(100vh - 160px); }
    section { padding: 18px 20px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    section:last-child { border-right: 0; }
    h2 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    textarea {
      width: 100%; min-height: 220px; resize: vertical; background: #0e0d0b; color: var(--ink);
      border: 1px solid var(--line); padding: 10px; font: 12px/1.4 ui-monospace, Consolas, monospace;
    }
    button {
      align-self: start; background: var(--ink); color: var(--bg); border: 0; padding: 8px 14px;
      font-weight: 650; letter-spacing: 0.04em; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .verdict {
      min-height: 88px; display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 750; letter-spacing: 0.04em; border: 1px solid var(--line);
      background: #0e0d0b;
    }
    .verdict.go { color: var(--go); }
    .verdict.no { color: var(--stop); }
    .verdict.wait { color: var(--muted); font-size: 16px; font-weight: 500; }
    pre {
      margin: 0; background: #0e0d0b; border: 1px solid var(--line); padding: 10px;
      font: 12px/1.45 ui-monospace, Consolas, monospace; overflow: auto; min-height: 88px; white-space: pre-wrap;
    }
    .hit { background: #3a2208; color: #ffd18a; }
    .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    @media (max-width: 980px) { main, .speed { grid-template-columns: 1fr; } section { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LOCAL JEV INSPECTOR</h1>
      <div class="sub">0.8B gatekeeper · stop / extract = LLM · scan = regex</div>
    </div>
    <div id="health">checking API...</div>
  </header>
  <div class="speed">
    <div class="chip"><span>stop typical</span><b>~0.20s</b></div>
    <div class="chip"><span>extract typical</span><b>~0.70s</b></div>
    <div class="chip"><span>scan typical</span><b>~0ms</b></div>
    <div class="chip"><span>last call</span><b id="last">-</b></div>
  </div>
  <main>
    <section>
      <h2>1. Stop · loop gate</h2>
      <textarea id="stopLog">pytest -q
..... 12 passed in 3.1s
exit_code=0
AGENT: all acceptance tests green.</textarea>
      <button onclick="runStop()">Run /jev/stop</button>
      <div id="stopOut" class="verdict wait">waiting</div>
      <div id="stopMeta" class="meta"></div>
    </section>
    <section>
      <h2>2. Extract · structured JSON</h2>
      <textarea id="extLog">I ran pytest and it took 40ms.
status=passed
error_code=none
Changed files: 2</textarea>
      <button onclick="runExtract()">Run /jev/extract</button>
      <pre id="extOut">waiting</pre>
      <div id="extMeta" class="meta"></div>
    </section>
    <section>
      <h2>3. Scan · regex needle</h2>
      <textarea id="scanLog">access GET /index.html 200
stats cpu=12% mem=45%
##### BEGIN ERROR #####
[ERROR] diagnostic_id=JEV-NEEDLE-99 action=halt_loop
##### END ERROR #####
access GET /healthz 200</textarea>
      <button onclick="runScan()">Run /jev/scan</button>
      <pre id="scanOut">waiting</pre>
      <div id="scanMeta" class="meta"></div>
    </section>
  </main>
  <script>
    const api = "";
    function ms(m) {
      if (!m) return "";
      const t = (m.total_s * 1000);
      const label = t < 1 ? t.toFixed(3) + " ms" : t.toFixed(0) + " ms";
      document.getElementById("last").textContent = label;
      return `ttft ${m.ttft_s.toFixed(3)}s · total ${m.total_s.toFixed(3)}s · ${m.completion_tokens} tok · ${m.tok_s.toFixed(0)} tok/s`;
    }
    async function ping() {
      const el = document.getElementById("health");
      try {
        const r = await fetch(api + "/health");
        const j = await r.json();
        el.className = j.ok && j.llm_ok ? "ok" : "bad";
        el.textContent = j.ok && j.llm_ok ? "API + LLM up" : "LLM down: " + (j.error || "check llama-server");
      } catch (e) {
        el.className = "bad";
        el.textContent = "JEV API unreachable";
      }
    }
    async function runStop() {
      const box = document.getElementById("stopOut");
      box.className = "verdict wait"; box.textContent = "running...";
      const r = await fetch(api + "/jev/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ log: document.getElementById("stopLog").value }) });
      const j = await r.json();
      if (!r.ok) { box.className = "verdict no"; box.textContent = "ERR"; document.getElementById("stopMeta").textContent = JSON.stringify(j); return; }
      box.className = "verdict " + (j.stop ? "go" : "no");
      box.textContent = j.stop ? "STOP" : "CONTINUE";
      document.getElementById("stopMeta").textContent = "raw " + j.raw + " · " + ms(j.metrics);
    }
    async function runExtract() {
      const box = document.getElementById("extOut");
      box.textContent = "running...";
      const r = await fetch(api + "/jev/extract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ log: document.getElementById("extLog").value }) });
      const j = await r.json();
      if (!r.ok) { box.textContent = JSON.stringify(j, null, 2); return; }
      box.textContent = JSON.stringify(j.result, null, 2);
      document.getElementById("extMeta").textContent = ms(j.metrics);
    }
    async function runScan() {
      const log = document.getElementById("scanLog").value;
      const box = document.getElementById("scanOut");
      box.textContent = "running...";
      const r = await fetch(api + "/jev/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ log }) });
      const j = await r.json();
      if (!r.ok) { box.textContent = JSON.stringify(j, null, 2); return; }
      const hit = (j.line || "");
      const shown = log.split("\n").map(line => line === hit ? '<span class="hit">' + line + "</span>" : line).join("\n");
      box.innerHTML = hit ? shown : "(no [ERROR]/[FATAL] line)";
      document.getElementById("scanMeta").textContent = "needle: " + (hit || "-") + " · " + ms(j.metrics);
    }
    ping();
    setInterval(ping, 4000);
  </script>
</body>
</html>
